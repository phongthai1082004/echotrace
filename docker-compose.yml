x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis-service:
    image: redis:alpine
    container_name: redis-container
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-service:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: backend_service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://${REDIS_HOST:-redis-service}:6379
      BACKEND_PORT: "4000"
      TZ: UTC
      # Pass-through: all other backend vars come from env_file in override
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.development}
    ports:
      - "${BACKEND_PORT:-4000}:4000"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    depends_on:
      redis-service:
        condition: service_healthy

  frontend-service:
    build:
      context: .
      dockerfile: frontend/dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL:-http://localhost:4000}
    container_name: frontend_service
    environment:
      BACKEND_URL: http://${BACKEND_HOST:-backend-service}:4000
    env_file:
      - ${FRONTEND_ENV_FILE:-./frontend/.env.development}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    depends_on:
      - backend-service

  nginx-service:
    build:
      context: ./nginx
      dockerfile: dockerfile
    container_name: nginx-container
    environment:
      NGINX_PORT: ${NGINX_PORT:-80}
      SERVER_DOMAIN: ${SERVER_DOMAIN:-localhost}
      FRONTEND_HOST: ${FRONTEND_HOST:-frontend-service}
      FRONTEND_PORT: "3000"
      BACKEND_HOST: ${BACKEND_HOST:-backend-service}
      BACKEND_PORT: "4000"
    ports:
      - "${NGINX_PORT:-80}:${NGINX_PORT:-80}"
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    depends_on:
      - frontend-service
      - backend-service

volumes:
  redis_data:
