x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis-service:
    image: redis:alpine
    container_name: ${REDIS_HOST:-redis-service}
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-service:
    image: ghcr.io/phongthai1082004/echotrace/backend-service:latest
    container_name: ${BACKEND_HOST:-backend-service}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis-service:6379
      - BACKEND_PORT=${BACKEND_PORT:-4000}
      - TZ=UTC
    env_file:
      - ${BACKEND_ENV_FILE:-./backend/.env.production}
    ports:
      - "${BACKEND_PORT:-4000}:${BACKEND_PORT:-4000}"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2048M
    depends_on:
      redis-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:4000/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 60s

  frontend-service:
    image: ghcr.io/phongthai1082004/echotrace/frontend-service:latest
    container_name: ${FRONTEND_HOST:-frontend-service}
    environment:
      - BACKEND_URL=http://${BACKEND_HOST:-backend-service}:${BACKEND_PORT:-4000}
      - PORT=${FRONTEND_PORT:-3000}
      - HOSTNAME=0.0.0.0
    env_file:
      - ${FRONTEND_ENV_FILE:-./frontend/.env.production}
    ports:
      - "${FRONTEND_PORT:-3000}:${FRONTEND_PORT:-3000}"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    depends_on:
      backend-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 30s

  nginx-service:
    image: ghcr.io/phongthai1082004/echotrace/nginx-service:latest
    container_name: nginx-container
    environment:
      - SERVER_DOMAIN=${SERVER_DOMAIN:-bettermemoire.com}
      - FRONTEND_HOST=${FRONTEND_HOST:-frontend-service}
      - FRONTEND_PORT=${FRONTEND_PORT:-3000}
      - BACKEND_HOST=${BACKEND_HOST:-backend-service}
      - BACKEND_PORT=${BACKEND_PORT:-4000}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    depends_on:
      frontend-service:
        condition: service_started
      backend-service:
        condition: service_started

volumes:
  redis_data:
