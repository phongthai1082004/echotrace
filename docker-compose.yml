x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis-service:
    image: redis:alpine
    container_name: ${REDIS_HOST}
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  backend-service:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: ${BACKEND_HOST}
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=redis://redis-service:6379   
      - BACKEND_PORT=${BACKEND_PORT}
      - TZ=UTC
    env_file:
      - ${BACKEND_ENV_FILE}
    ports:
      - "${BACKEND_PORT}:${BACKEND_PORT}"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "1.50"
          memory: 2048M   
    depends_on:
      redis-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${BACKEND_PORT}/').then(r => process.exit(r.status < 500 ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  frontend-service:
    build:
      context: .
      dockerfile: frontend/dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: ${NEXT_PUBLIC_BACKEND_URL}
    container_name: ${FRONTEND_HOST}
    environment:
      - BACKEND_URL=http://${BACKEND_HOST}:${BACKEND_PORT}
      - PORT=${FRONTEND_PORT}
      - HOSTNAME=0.0.0.0
    env_file:
      - ${FRONTEND_ENV_FILE}
    ports:
      - "${FRONTEND_PORT}:${FRONTEND_PORT}"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.50"
          memory: 512M
    depends_on:
      backend-service:
        condition: service_started
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:${FRONTEND_PORT}').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 15s

  nginx-service:
    build:
      context: ./nginx
      dockerfile: dockerfile
    container_name: nginx-container
    environment:
      - SERVER_DOMAIN=${SERVER_DOMAIN}
      - FRONTEND_HOST=${FRONTEND_HOST}
      - FRONTEND_PORT=${FRONTEND_PORT}
      - BACKEND_HOST=${BACKEND_HOST}
      - BACKEND_PORT=${BACKEND_PORT}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Mount SSL certs từ VPS (generated 1 lần bằng certbot, tự renew)
      # Không commit certs vào repo, chỉ tồn tại trên VPS
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    depends_on:
      frontend-service:
        condition: service_started
      backend-service:
        condition: service_started

volumes:
  redis_data: