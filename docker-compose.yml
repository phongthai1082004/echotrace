x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis-service:
    image: redis:alpine
    container_name: redis-container
    command: ["redis-server", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
  backend-service:
    build:
      context: .
      dockerfile: backend/dockerfile
    container_name: backend_service
    environment:
      REDIS_URL: "redis://redis-service:6379"
      BACKEND_PORT: "4000"
      TZ: UTC
    env_file:
      - ./backend/.env.development
    ports:
      - "4000:4000"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    depends_on:
      redis-service:
        condition: service_healthy
  frontend-service:
    build:
      context: .
      dockerfile: frontend/dockerfile
      args:
        NEXT_PUBLIC_BACKEND_URL: "http://localhost:4000"
    container_name: frontend_service
    environment:
      BACKEND_URL: "http://backend-service:4000"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
    env_file:
      - ./frontend/.env.development
    ports:
      - "3000:3000"
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
    depends_on:
      - backend-service
  nginx-service:
    build:
      context: ./nginx
      dockerfile: dockerfile
    container_name: nginx-container
    environment:
      NGINX_PORT: "80"
      SERVER_DOMAIN: "localhost"
      FRONTEND_HOST: "frontend-service"
      FRONTEND_PORT: "3000"
      BACKEND_HOST: "backend-service"
      BACKEND_PORT: "4000"
    ports:
      - "80:80"
    restart: always
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 64M
    depends_on:
      - frontend-service
      - backend-service

volumes:
  redis_data:
