name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/phongthai1082004/echotrace

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # STAGE 0: CHANGE DETECTION â€” build only what changed
  # ============================================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'docker-compose.yml'
              - '.github/workflows/cicd.yml'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'docker-compose.yml'
              - '.github/workflows/cicd.yml'

  # ============================================================
  # STAGE 1: LINT & TYPE CHECK (PRs + main)
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @echotrace/shared build

      - name: Generate Prisma client
        if: matrix.service == 'backend'
        run: pnpm db:generate

      - name: Type check backend
        if: matrix.service == 'backend'
        run: pnpm --filter backend type-check

      - name: Lint & type check frontend
        if: matrix.service == 'frontend'
        run: pnpm --filter frontend lint && pnpm --filter frontend type-check

  # ============================================================
  # STAGE 2: BUILD & PUSH â€” only services whose sources changed
  # ============================================================
  build-backend:
    name: Build & Push Backend
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build & Push Frontend
    runs-on: ubuntu-latest
    needs: [changes, lint]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/frontend-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ./frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}

  # ============================================================
  # STAGE 3: DEPLOY TO VPS â€” runs when nothing failed and something built
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    if: |
      !cancelled() &&
      needs.build-backend.result != 'failure' &&
      needs.build-frontend.result != 'failure' &&
      (needs.build-backend.result == 'success' || needs.build-frontend.result == 'success')
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy configs to VPS
        run: |
          # Deploy ONLY the compose file + images. The .env files on the VPS are managed
          # there manually â€” never overwrite them from CI.
          scp docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.APP_DIR }}/

      - name: Deploy
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} "
            set -e
            cd ${APP_DIR}

            echo '[LOG] Logging in to GHCR...'
            echo '${GH_TOKEN}' | docker login ghcr.io -u ${GH_ACTOR} --password-stdin

            echo '[LOG] Pulling updated images...'
            docker compose pull

            echo '[LOG] Restarting containers...'
            docker compose up -d --force-recreate --remove-orphans

            echo '[LOG] Waiting for startup...'
            sleep 40

            docker compose ps
          "
