name: CI/CD Pipeline - 6 Stages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  PNPM_HOME: /home/runner/.pnpm-store

permissions:
  contents: read
  packages: write

jobs:
  # ==========================================
  # STAGE 1: LINT & TYPE CHECK
  # ==========================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - service: backend
            cmd: pnpm --filter backend run lint && pnpm --filter backend run type-check
            working-dir: backend
          - service: frontend
            cmd: pnpm --filter frontend run lint && pnpm --filter frontend run type-check
            working-dir: frontend
          - service: shared
            cmd: pnpm --filter @echotrace/shared run build
            working-dir: shared

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Run linting & type check - ${{ matrix.service }}
        run: |
          cd ${{ matrix.working-dir }}
          ${{ matrix.cmd }}

  # ==========================================
  # STAGE 2: DETECT CHANGES
  # ==========================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      shared: ${{ steps.filter.outputs.shared }}
      infra: ${{ steps.filter.outputs.infra }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed paths
        uses: dorny/paths-filter@v2
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - 'shared/**'
              - 'pnpm-workspace.yaml'
              - '.pnpmfile.cjs'
            frontend:
              - 'frontend/**'
              - 'shared/**'
              - 'pnpm-workspace.yaml'
              - '.pnpmfile.cjs'
            shared:
              - 'shared/**'
              - 'pnpm-workspace.yaml'
            infra:
              - 'docker-compose.yml'
              - 'nginx/**'
              - '.github/workflows/**'

  # ==========================================
  # STAGE 3: TARGETED TESTS (SKIPPED - FIX LATER)
  # ==========================================
  # test:
  #   name: Test - ${{ matrix.service }}
  #   needs: [lint, changes]
  #   runs-on: ubuntu-latest
  #   strategy:
  #     matrix:
  #       include:
  #         - service: backend
  #           changed: ${{ needs.changes.outputs.backend }}
  #           cmd: pnpm --filter backend test:unit --forceExit
  #         - service: frontend
  #           changed: ${{ needs.changes.outputs.frontend }}
  #           cmd: pnpm --filter frontend test --run
  #   
  #   if: |
  #     github.event_name == 'pull_request' ||
  #     (github.event_name == 'push' && github.ref == 'refs/heads/main')
  #
  #   steps:
  #     - name: Checkout repository
  #       uses: actions/checkout@v4
  #
  #     - name: Setup pnpm
  #       uses: pnpm/action-setup@v2
  #       with:
  #         version: 8
  #
  #     - name: Setup Node.js
  #       uses: actions/setup-node@v4
  #       with:
  #         node-version: 22
  #         cache: pnpm
  #
  #     - name: Install dependencies
  #       run: pnpm install --no-frozen-lockfile
  #
  #     - name: Run tests - ${{ matrix.service }}
  #       if: matrix.changed == 'true'
  #       run: |
  #         cd ${{ matrix.service }}
  #         ${{ matrix.cmd }}
  #       env:
  #         NODE_ENV: test
  #         JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
  #         JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}



  # ==========================================
  # STAGE 4: BUILD & PUSH IMAGES
  # ==========================================
  build:
    name: Build & Push - ${{ matrix.service }}
    needs: [lint, changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    
    strategy:
      matrix:
        include:
          - service: backend-service
            dockerfile: backend/Dockerfile
            context: .
          - service: frontend-service
            dockerfile: frontend/Dockerfile
            context: .
          - service: nginx-service
            dockerfile: nginx/dockerfile
            context: .

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-options: image=moby/buildkit:master

      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=sha,format=long
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push container image
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}



  # ==========================================
  # STAGE 5: DEPLOY
  # ==========================================
  deploy:
    name: Deploy to VPS
    needs: [build, changes]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy services
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GITHUB_TOKEN_VAL: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_VAL: ${{ github.actor }}
        run: |
          echo "[LOG] Copying docker-compose.yml and nginx config to VPS..."
          scp docker-compose.yml ${VPS_USER}@${VPS_HOST}:${APP_DIR}/
          scp -r nginx ${VPS_USER}@${VPS_HOST}:${APP_DIR}/
          
          ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} "
            set -e
            cd ${APP_DIR}

            echo '[LOG] Logging into ghcr.io...'
            echo '${GITHUB_TOKEN_VAL}' | docker login ghcr.io -u ${GITHUB_ACTOR_VAL} --password-stdin

            echo '[LOG] Checking env file...'
            ls -la ${APP_DIR}/
            head -3 ${APP_DIR}/.env.production || echo 'FILE NOT FOUND'

            echo '[LOG] Pulling latest images from ghcr.io...'
            docker compose --env-file ${APP_DIR}/.env.production pull

            echo '[LOG] Starting containers...'
            docker compose --env-file ${APP_DIR}/.env.production up -d --force-recreate --remove-orphans

            echo '[LOG] Waiting for services to initialize...'
            sleep 40

            echo '[LOG] Container status:'
            docker compose --env-file ${APP_DIR}/.env.production ps
          "

  # ==========================================
  # STAGE 6: HEALTH CHECK & AUTO-ROLLBACK
  # ==========================================
  health-check:
    name: Health Check & Rollback
    needs: deploy
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH Connection
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Health check backends
        id: health
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no \
            ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'HEALTH_EOF'
          set -e

          echo "[LOG] Waiting 40s for services to fully start (migrations + workers)..."
          sleep 40

          echo "[LOG] Checking backend /health..."
          for i in {1..5}; do
            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo "✓ Backend is healthy"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "✗ Backend health check failed"
              docker logs backend-service --tail=30
              exit 1
            fi
            echo "Retry $i/5 (waiting 10s)..."
            sleep 10
          done

          echo "[LOG] Checking frontend /api/health..."
          for i in {1..5}; do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✓ Frontend is healthy"
              break
            fi
            if [ $i -eq 5 ]; then
              echo "✗ Frontend health check failed"
              docker logs frontend-service --tail=30
              exit 1
            fi
            echo "Retry $i/5 (waiting 10s)..."
            sleep 10
          done

          echo "[LOG] Checking nginx port 80..."
          for i in {1..3}; do
            if curl -sf http://localhost > /dev/null 2>&1; then
              echo "✓ Nginx is responding"
              break
            fi
            if [ $i -eq 3 ]; then
              echo "✗ Nginx health check failed"
              docker logs nginx-container --tail=20
              exit 1
            fi
            echo "Retry $i/3 (waiting 5s)..."
            sleep 5
          done

          echo "All services are healthy!"
          HEALTH_EOF

      - name: Auto-rollback on failure
        if: steps.health.outcome == 'failure'
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GITHUB_TOKEN_VAL: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ACTOR_VAL: ${{ github.actor }}
        run: |
          ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} "
            set -e
            cd ${APP_DIR}

            echo 'Health checks failed - initiating rollback...'
            echo '${GITHUB_TOKEN_VAL}' | docker login ghcr.io -u ${GITHUB_ACTOR_VAL} --password-stdin

            docker compose --env-file ${APP_DIR}/.env.production pull
            docker compose --env-file ${APP_DIR}/.env.production down
            docker compose --env-file ${APP_DIR}/.env.production up -d --force-recreate

            sleep 10

            if curl -sf http://localhost:4000/health > /dev/null 2>&1; then
              echo 'Rollback successful'
              docker compose --env-file ${APP_DIR}/.env.production ps
            else
              echo 'Rollback completed - manual intervention may be needed'
              docker compose --env-file ${APP_DIR}/.env.production logs --tail=50
              exit 1
            fi
          "

      - name: Deployment success
        if: steps.health.outcome == 'success'
        run: |
          echo "🎉 Deployment completed successfully!"
          echo "✅ All health checks passed"
          echo "📊 Services are running and responding normally"
