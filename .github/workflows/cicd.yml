name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/phongthai1082004/echotrace

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # STAGE 1: LINT & TYPE CHECK
  # ============================================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @echotrace/shared build

      - name: Generate Prisma client
        if: matrix.service == 'backend'
        run: pnpm db:generate

      - name: Type check backend
        if: matrix.service == 'backend'
        run: pnpm --filter backend type-check

      - name: Lint & type check frontend
        if: matrix.service == 'frontend'
        run: pnpm --filter frontend lint && pnpm --filter frontend type-check

  # ============================================================
  # STAGE 2: UNIT TESTS (skipped — no tests found)
  # ============================================================
  test:
    name: Test (skipped)
    runs-on: ubuntu-latest
    needs: lint
    if: false
    steps:
      - run: echo "Tests skipped — no test suite configured"

  # ============================================================
  # STAGE 3: BUILD & PUSH IMAGES
  # ============================================================
  build:
    name: Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      matrix:
        service: [backend, frontend, nginx]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.service }}-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: ${{ matrix.service }}/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}

  # ============================================================
  # STAGE 4: DEPLOY TO VPS
  # ============================================================
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy configs to VPS
        run: |
          scp docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.APP_DIR }}/
          scp -r nginx ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.APP_DIR }}/

      - name: Setup environment files
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            mkdir -p ${{ secrets.APP_DIR }}/backend
            echo 'DATABASE_URL=${{ secrets.DATABASE_URL }}' > ${{ secrets.APP_DIR }}/backend/.env
            echo 'NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}' >> ${{ secrets.APP_DIR }}/backend/.env
            mkdir -p ${{ secrets.APP_DIR }}/frontend
            echo 'NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}' > ${{ secrets.APP_DIR }}/frontend/.env
          "

      - name: Deploy
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} "
            set -e
            cd ${APP_DIR}

            echo '${GH_TOKEN}' | docker login ghcr.io -u ${GH_ACTOR} --password-stdin

            echo '[LOG] Pulling updated images...'
            docker compose pull

            echo '[LOG] Restarting containers...'
            docker compose up -d --force-recreate --remove-orphans

            echo '[LOG] Waiting for startup...'
            sleep 40

            docker compose ps
          "

  # ============================================================
  # STAGE 5: HEALTH CHECK & AUTO-ROLLBACK
  # ============================================================
  health-check:
    name: Health Check
    runs-on: ubuntu-latest
    needs: deploy
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Health check
        id: health
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -e

          check() {
            local url=$1 name=$2 retries=${3:-5} wait=${4:-10}
            for i in $(seq 1 $retries); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "✓ $name healthy"
                return 0
              fi
              echo "  $name retry $i/$retries..."
              sleep $wait
            done
            echo "✗ $name failed"
            return 1
          }

          check http://localhost:4000/health "Backend" 5 10
          check http://localhost:3000/api/health "Frontend" 5 10
          check http://localhost "Nginx" 3 5

          echo "All services healthy!"
          EOF

      - name: Auto-rollback
        if: steps.health.outcome == 'failure'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ secrets.APP_DIR }}
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose down
            docker compose pull
            docker compose up -d --force-recreate
            sleep 15
            docker compose ps
            echo 'Rollback completed - manual intervention may be needed'
          "
          exit 1

      - name: Success
        if: steps.health.outcome == 'success'
        run: echo "🎉 Deployment successful! All health checks passed."