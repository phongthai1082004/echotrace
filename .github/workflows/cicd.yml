name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/phongthai1082004/echotrace

permissions:
  contents: read
  packages: write

jobs:
  # ============================================================
  # STAGE 1: DETECT CHANGES (DISABLED)
  # ============================================================
  # changes:
  #   name: Detect Changes
  #   runs-on: ubuntu-latest
  #   if: github.event_name == 'push' && github.ref == 'refs/heads/main'
  #   outputs:
  #     backend: ${{ steps.filter.outputs.backend }}
  #     frontend: ${{ steps.filter.outputs.frontend }}
  #     nginx: ${{ steps.filter.outputs.nginx }}
  #   steps:
  #     - uses: actions/checkout@v4
  #       with:
  #         fetch-depth: 0
  #
  #     - uses: dorny/paths-filter@v2
  #       id: filter
  #       with:
  #         filters: |
  #           backend:
  #             - 'backend/**'
  #             - 'shared/**'
  #             - 'pnpm-lock.yaml'
  #             - 'pnpm-workspace.yaml'
  #           frontend:
  #             - 'frontend/**'
  #             - 'shared/**'
  #             - 'pnpm-lock.yaml'
  #             - 'pnpm-workspace.yaml'
  #           nginx:
  #             - 'nginx/**'

  # ============================================================
  # STAGE 2: CHECK (LINT & TYPE CHECK)
  # ============================================================
  lint:
    name: Lint & Type Check
    needs: [changes]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build shared
        run: pnpm --filter @echotrace/shared build

      - name: Generate Prisma client
        run: pnpm db:generate

      - name: Type check backend
        run: pnpm --filter backend type-check

      - name: Lint & type check frontend
        run: pnpm --filter frontend lint && pnpm --filter frontend type-check

  # ============================================================
  # STAGE 3: TEST (bỏ qua nếu không có test files)
  # ============================================================
  test:
    name: Test
    needs: [lint, changes]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run backend unit tests
        run: pnpm --filter backend test:unit --passWithNoTests
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: ${{ secrets.JWT_ACCESS_SECRET }}
          JWT_REFRESH_SECRET: ${{ secrets.JWT_REFRESH_SECRET }}
          DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}

  # ============================================================
  # STAGE 4: BUILD & PUSH — chỉ build service có thay đổi
  # ============================================================
  build-backend:
    name: Build Backend
    needs: [lint, changes]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.backend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/backend-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    name: Build Frontend
    needs: [lint, changes]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.frontend == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/frontend-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}

  build-nginx:
    name: Build Nginx
    needs: [lint, changes]
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.changes.outputs.nginx == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE_PREFIX }}/nginx-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - uses: docker/build-push-action@v5
        with:
          context: .
          file: nginx/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=nginx
          cache-to: type=gha,mode=max,scope=nginx

  # ============================================================
  # STAGE 5: DEPLOY
  # Chạy khi ít nhất 1 service thay đổi (build jobs skipped = OK)
  # ============================================================
  deploy:
    name: Deploy to VPS
    needs: [changes, build-backend, build-frontend, build-nginx]
    runs-on: ubuntu-latest
    if: |
      always() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      (needs.changes.outputs.backend == 'true' ||
       needs.changes.outputs.frontend == 'true' ||
       needs.changes.outputs.nginx == 'true') &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled')

    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Copy configs to VPS
        run: |
          scp docker-compose.yml ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.APP_DIR }}/
          scp -r nginx ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.APP_DIR }}/

      - name: Setup environment files
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            mkdir -p ${{ secrets.APP_DIR }}/backend
            echo 'DATABASE_URL=${{ secrets.DATABASE_URL }}' > ${{ secrets.APP_DIR }}/backend/.env
            echo 'NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}' >> ${{ secrets.APP_DIR }}/backend/.env
            mkdir -p ${{ secrets.APP_DIR }}/frontend
            echo 'NEXT_PUBLIC_BACKEND_URL=${{ secrets.NEXT_PUBLIC_BACKEND_URL }}' > ${{ secrets.APP_DIR }}/frontend/.env
          "

      - name: Deploy
        env:
          APP_DIR: ${{ secrets.APP_DIR }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          ssh -o StrictHostKeyChecking=no ${VPS_USER}@${VPS_HOST} "
            set -e
            cd ${APP_DIR}

            echo '${GH_TOKEN}' | docker login ghcr.io -u ${GH_ACTOR} --password-stdin

            echo '[LOG] Pulling updated images...'
            docker compose pull

            echo '[LOG] Restarting containers...'
            docker compose up -d --force-recreate --remove-orphans

            echo '[LOG] Waiting for startup...'
            sleep 40

            docker compose ps
          "

  # ============================================================
  # STAGE 6: HEALTH CHECK & AUTO-ROLLBACK
  # ============================================================
  health-check:
    name: Health Check
    needs: deploy
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.deploy.result == 'success'

    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Health check
        id: health
        continue-on-error: true
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
          set -e

          check() {
            local url=$1 name=$2 retries=${3:-5} wait=${4:-10}
            for i in $(seq 1 $retries); do
              if curl -sf "$url" > /dev/null 2>&1; then
                echo "✓ $name healthy"
                return 0
              fi
              echo "  $name retry $i/$retries..."
              sleep $wait
            done
            echo "✗ $name failed"
            return 1
          }

          check http://localhost:4000/health "Backend" 5 10
          check http://localhost:3000/api/health "Frontend" 5 10
          check http://localhost "Nginx" 3 5

          echo "All services healthy!"
          EOF

      - name: Auto-rollback
        if: steps.health.outcome == 'failure'
        run: |
          ssh -o StrictHostKeyChecking=no ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} "
            cd ${{ secrets.APP_DIR }}
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose down
            docker compose pull
            docker compose up -d --force-recreate
            sleep 15
            docker compose ps
            echo 'Rollback completed - manual intervention may be needed'
          "
          exit 1

      - name: Success
        if: steps.health.outcome == 'success'
        run: echo "🎉 Deployment successful! All health checks passed."


