# =============================================================================
# LOCAL DEVELOPMENT OVERRIDE
# Tự động load khi chạy `docker compose up` ở local
# KHÔNG commit file này nếu có thông tin nhạy cảm
#
# Usage:
#   docker compose up -d --build          # local, build từ source
#   npx smee-client --url https://smee.io/r1JS0PEfPNnOAH3u --target http://localhost:4000  # webhook relay
# =============================================================================

services:
  backend-service:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: echotrace-backend:local
    env_file:
      - ./backend/.env.development

  frontend-service:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    image: echotrace-frontend:local
    env_file:
      - ./frontend/.env.development

  # Webhook relaying: use smee.io channel (permanent, forwards to localhost:4000)
  #   npx smee-client --url https://smee.io/r1JS0PEfPNnOAH3u --target http://localhost:4000
  # WEBHOOK_URL=https://smee.io/r1JS0PEfPNnOAH3u/api/payments/webhooks/payos
