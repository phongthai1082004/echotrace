# =============================================================================
# LOCAL DEVELOPMENT OVERRIDE
# Tự động load khi chạy `docker compose up` ở local
# KHÔNG commit file này nếu có thông tin nhạy cảm
#
# Usage:
#   docker compose up -d --build          # local, build từ source
#   docker compose --profile dev up -d    # local + ngrok tunnel
# =============================================================================

services:
  backend-service:
    build:
      context: .
      dockerfile: ./backend/Dockerfile
    image: echotrace-backend:local
    env_file:
      - ./backend/.env.development

  frontend-service:
    build:
      context: .
      dockerfile: ./frontend/Dockerfile
    image: echotrace-frontend:local
    env_file:
      - ./frontend/.env.development

  # Không dùng nginx local (truy cập trực tiếp qua port)
  nginx-service:
    profiles:
      - production

  # Expose backend ra internet cho PayOS webhook testing
  # Lấy URL: docker compose logs ngrok-tunnel | grep "url="
  # Dashboard: http://localhost:4040
  ngrok-tunnel:
    image: ngrok/ngrok:latest
    container_name: ngrok-tunnel
    profiles:
      - dev
    command: http backend-service:4000 --log stdout
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN:-}
    ports:
      - "4040:4040"
    restart: unless-stopped
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: 64M
    depends_on:
      backend-service:
        condition: service_started
