# =============================================================================
# LOCAL DEVELOPMENT OVERRIDE
# Auto-loaded by `docker compose up` — no extra flags needed.
#
# Adds postgres-service và override DATABASE_URL của backend để trỏ vào
# container postgres thay vì cloud DB.
# =============================================================================

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:

  postgres-service:
    image: postgres:16-alpine
    container_name: postgres_container
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123abc"
      POSTGRES_DB: echotrace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    logging: *default-logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d echotrace"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend-service:
    environment:
      DATABASE_URL: "postgresql://postgres:123abc@postgres-service:5432/echotrace"
    depends_on:
      postgres-service:
        condition: service_healthy

volumes:
  postgres_data:
