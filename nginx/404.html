<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>404 · Cabinet Memoir</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 24px;
    background: #FFF7D6;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
    color: #222;
    position: relative;
    overflow: hidden;
  }
  .grid-bg {
    pointer-events: none;
    position: absolute;
    inset: 0;
    opacity: .35;
    background-image:
      linear-gradient(#222 1px, transparent 1px),
      linear-gradient(90deg, #222 1px, transparent 1px);
    background-size: 48px 48px;
  }
  .wrap { position: relative; width: 100%; max-width: 36rem; }
  .card {
    background: #fff;
    border-radius: 10px;
    border: 3px solid #222;
    box-shadow: 6px 6px 0 #222;
    padding: 2rem;
  }
  @media (min-width: 1601px) { .card { padding: 2.5rem; } }
  .eyebrow {
    font-family: ui-monospace, "Courier New", monospace;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #666;
    margin-bottom: 1.5rem;
  }
  h1 { font-size: clamp(3.75rem, 8vw, 4.5rem); font-weight: 700; line-height: .9; margin-bottom: 1rem; }
  h2 { font-size: 1.5rem; font-weight: 700; margin-bottom: .75rem; }
  .desc { font-size: .875rem; color: #666; line-height: 1.625; margin-bottom: 2rem; max-width: 28rem; }
  .btn {
    display: inline-block;
    background: #222;
    color: #fff;
    font-weight: 700;
    font-size: 11px;
    letter-spacing: .1em;
    text-transform: uppercase;
    text-decoration: none;
    text-align: center;
    padding: 1rem 1.5rem;
    border-radius: 10px;
    border: 3px solid #222;
    box-shadow: 4px 4px 0 #222;
    transition: transform .15s, box-shadow .15s;
  }
  .btn:hover { transform: translate(2px, 2px); box-shadow: 2px 2px 0 #222; }
  .coords {
    font-family: ui-monospace, "Courier New", monospace;
    font-size: 8px;
    font-weight: 700;
    letter-spacing: .1em;
    text-transform: uppercase;
    color: #999;
    margin-top: 2rem;
    text-align: center;
  }
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="wrap">
    <div class="card">
      <p class="eyebrow"><span id="code">404</span> · Cabinet Memoir</p>
      <h1 id="code-h">404</h1>
      <h2 id="title"></h2>
      <p class="desc" id="desc"></p>
      <a class="btn" id="back" href="/"></a>
    </div>
    <p class="coords">&mdash; 20.00&deg; N, 000.00&deg; E &middot; off the map &mdash;</p>
  </div>
<script>
(function () {
  var T = {
    en: {
      title: "Lost in transit",
      desc: "This page has wandered off the map. The coordinates don't match any journal in our archive.",
      back: "Back to start \u2192"
    },
    vi: {
      title: "L\u1ea1c \u0111\u01b0\u1eddng",
      desc: "Trang n\u00e0y \u0111\u00e3 r\u1eddi kh\u1ecfi b\u1ea3n \u0111\u1ed3. T\u1ecda \u0111\u1ed9 kh\u00f4ng kh\u1edbp v\u1edbi b\u1ea5t k\u1ef3 nh\u1eadt k\u00fd n\u00e0o trong kho l\u01b0u tr\u1eef.",
      back: "V\u1ec1 trang ch\u1ee7 \u2192"
    },
    es: {
      title: "Perdido en tr\u00e1nsito",
      desc: "Esta p\u00e1gina se ha salido del mapa. Las coordenadas no coinciden con ning\u00fan diario de nuestro archivo.",
      back: "Volver al inicio \u2192"
    }
  };
  var lang = (navigator.language || "en").slice(0, 2).toLowerCase();
  var t = T[lang] || T.en;
  document.documentElement.lang = T[lang] ? lang : "en";
  document.getElementById("title").textContent = t.title;
  document.getElementById("desc").textContent = t.desc;
  document.getElementById("back").textContent = t.back;
})();
</script>
</body>
</html>
