# =========================================================================
# UPSTREAM CONFIGURATIONS
# =========================================================================
upstream frontend_upstream {
    server ${FRONTEND_HOST}:${FRONTEND_PORT};
    keepalive 32;
}

upstream backend_upstream {
    server ${BACKEND_HOST}:${BACKEND_PORT};
    keepalive 32;
}

# =========================================================================
# HTTP → HTTPS REDIRECT
# Mọi request HTTP đều redirect sang HTTPS
# =========================================================================
server {
    listen 80;
    server_name ${SERVER_DOMAIN} www.${SERVER_DOMAIN} api.${SERVER_DOMAIN};
    return 301 https://$host$request_uri;
}

# =========================================================================
# MAIN FRONTEND SERVER (bettermemoire.com)
# =========================================================================
server {
    listen 443 ssl http2;
    server_name ${SERVER_DOMAIN} www.${SERVER_DOMAIN};

    # SSL certificates (mount từ /etc/letsencrypt trên VPS)
    ssl_certificate     /etc/letsencrypt/live/${SERVER_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_DOMAIN}/privkey.pem;

    # SSL security settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 50M;
    root /usr/share/nginx/html;

    # GZIP
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/json image/svg+xml;

    # Custom 404
    error_page 404 /404.html;
    location = /404.html {
        internal;
        root /usr/share/nginx/html;
    }

    # Static assets caching
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # General traffic → Frontend
    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_intercept_errors on;
    }
}

# =========================================================================
# API SERVER (api.bettermemoire.com)
# Backend chạy riêng subdomain, giao tiếp nội bộ qua http
# =========================================================================
server {
    listen 443 ssl http2;
    server_name api.${SERVER_DOMAIN};

    # SSL certificates (cùng cert vì dùng SAN hoặc wildcard)
    ssl_certificate     /etc/letsencrypt/live/${SERVER_DOMAIN}/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/${SERVER_DOMAIN}/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 50M;

    # Tất cả requests → Backend (nội bộ dùng http)
    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
