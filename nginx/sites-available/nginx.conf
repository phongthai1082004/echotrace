# Better Memoire — nginx site config
# VPS: /etc/nginx/sites-available/bettermemoire (+ symlink sang sites-enabled)
# KHÔNG chép đè /etc/nginx/nginx.conf (file chính giữ nguyên).
# File tĩnh: /var/www/html/404.html, /var/www/html/maintenance.html
# Bật bảo trì:  sudo touch /var/www/html/maintenance.on
# Tắt bảo trì:  sudo rm /var/www/html/maintenance.on
# (bật/tắt không cần reload nginx)

upstream frontend_upstream {
    server 127.0.0.1:3000;
}

upstream backend_upstream {
    server 127.0.0.1:4000;
}

server {
    listen 80;
    server_name bettermemoire.com www.bettermemoire.com api.bettermemoire.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name bettermemoire.com www.bettermemoire.com;

    ssl_certificate     /etc/letsencrypt/live/bettermemoire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettermemoire.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 50M;

    # ---- maintenance switch (chỉ block frontend, API giữ nguyên) ----
    # Ngoại lệ /maintenance.html để tránh loop khi error_page redirect nội bộ.
    set $maintenance 0;
    if (-f /var/www/html/maintenance.on) {
        set $maintenance 1;
    }
    if ($request_uri ~ "^/maintenance.html") {
        set $maintenance 0;
    }
    if ($maintenance) {
        return 503;
    }

    error_page 404 /404.html;
    error_page 503 /maintenance.html;

    location = /404.html {
        root /var/www/html;
    }
    location = /maintenance.html {
        root /var/www/html;
    }

    location / {
        proxy_pass http://frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_intercept_errors on;
    }
}

server {
    listen 443 ssl http2;
    server_name api.bettermemoire.com;

    ssl_certificate     /etc/letsencrypt/live/bettermemoire.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bettermemoire.com/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=63072000" always;

    client_max_body_size 50M;

    location / {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }
}
